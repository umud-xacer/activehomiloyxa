# tools/importlinter.cfg
# Encodes the static import matrix authoritative in SAD Sec 8.1 / Playbook Sec 3.2 / DEC-22.
# Generated by hand from the approved documents; do not diverge without an ADR.
# Run: lint-imports --config tools/importlinter.cfg

[importlinter]
include_external_packages = True
root_packages =
    identity
    profiles
    catalog
    configuration
    search
    media
    messaging
    billing
    ads
    notifications
    moderation
    admin
    analytics
    shared_kernel
    backbone

[importlinter:contract:shared-kernel-is-a-true-leaf]
name = shared_kernel imports nothing from any of the 13 modules or from backbone (DDD Sec 5.14, SAD Sec 8.1: "MAY statically import: nothing")
type = forbidden
source_modules =
    shared_kernel
forbidden_modules =
    identity
    profiles
    catalog
    configuration
    search
    media
    messaging
    billing
    ads
    notifications
    moderation
    admin
    analytics
    backbone

[importlinter:contract:backbone-imports-only-shared-kernel]
name = backbone (Task P-03 infra backbone) imports only shared_kernel -- never a bounded context (it is infrastructure machinery every module depends on, never the reverse)
type = forbidden
source_modules =
    backbone
forbidden_modules =
    identity
    profiles
    catalog
    configuration
    search
    media
    messaging
    billing
    ads
    notifications
    moderation
    admin
    analytics

[importlinter:contract:backbone-confined-to-infrastructure-and-interfaces]
name = a module's domain/ and application/ layers never import backbone directly (Clean Architecture: domain imports shared_kernel only; application depends on ports, not concrete infrastructure -- ABSOLUTE ARCHITECTURE RULES 1 and 4)
type = forbidden
source_modules =
    identity.domain
    identity.application
    profiles.domain
    profiles.application
    catalog.domain
    catalog.application
    configuration.domain
    configuration.application
    search.domain
    search.application
    media.domain
    media.application
    messaging.domain
    messaging.application
    billing.domain
    billing.application
    ads.domain
    ads.application
    notifications.domain
    notifications.application
    moderation.domain
    moderation.application
    admin.domain
    admin.application
    analytics.domain
    analytics.application
forbidden_modules =
    backbone

