[importlinter:contract:billing-catalog-profiles-ads-no-cycle]
name = billing has no static dependency on catalog/profiles/ads, and vice versa (AIR-10 named cycle)
type = forbidden
source_modules =
    billing
    catalog
    profiles
    ads
forbidden_modules =
    billing
    catalog
    profiles
    ads
# note: this contract's source/forbidden lists intentionally overlap (each module trivially
# imports itself); import-linter ignores self-references, so this only catches cross-imports
# among {billing, catalog, profiles, ads}.

