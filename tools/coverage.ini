# tools/coverage.ini -- QG-04 / COV-01 (Playbook Sec 11, Sec 16).
# Run: coverage run --rcfile=tools/coverage.ini -m pytest -c tools/pytest.ini
#      coverage report --rcfile=tools/coverage.ini
#
# COV-01 is two floors, not one: domain/application >= 90%, overall backend >= 80%.
# [report] fail_under below enforces the 80% overall floor; the 90% domain/application floor
# is a narrower, stricter requirement that a single coverage.py run cannot express on its own
# (it needs per-directory aggregation), so it is checked separately by
# tools/check_domain_coverage.py against this same run's coverage.json (wired into CI as its
# own step, not a coverage.py setting). Coverage is a floor, not a target (Playbook Sec 11).

[run]
branch = True
source =
    apps/backend/src
    packages/shared/src
    contracts
omit =
    */tests/*
    */__init__.py
    # One-off operator scripts (`python -m <name>`, run directly against a real environment by a
    # human, never imported by the served app or a worker's dispatch loop -- distinct from
    # `*_worker.py`, whose dispatcher logic IS exercised by tests even though its own
    # `if __name__ == "__main__":` entrypoint isn't). No test ever imports or runs these; QG-04
    # only started actually running this session (previously blocked by QG-01/QG-02 failing on
    # every prior CI run) and their true 0.00% first became visible then. Excluded for the same
    # reason `*/tests/*` is: not application logic a request or event ever passes through.
    apps/backend/src/bootstrap_admin.py
    apps/backend/src/reindex_search.py
    apps/backend/src/retire_subcategories.py
    apps/backend/src/seed_demo_listings.py
    apps/backend/src/seed_demo_organization.py

[report]
fail_under = 80
precision = 2
show_missing = True
skip_empty = True

[json]
output = coverage.json
