# tools/mypy.ini -- QG-02 (Playbook Sec 16). Run: mypy --config-file tools/mypy.ini
# Python 3.13+ per the Baseline's fixed technology stack (Sec 7).
# "Type hints MUST be complete and pass mypy --strict" (Playbook Sec 6).

[mypy]
python_version = 3.13
strict = True
mypy_path = apps/backend/src, packages/shared/src, .
namespace_packages = True
explicit_package_bases = True
plugins = pydantic.mypy
warn_unused_configs = True
show_error_codes = True
pretty = True

# domain/ MUST depend on nothing external (Playbook Sec 6); this is enforced by
# tools/importlinter.cfg's domain-purity contract, not by mypy, so no domain-specific
# override is needed here -- mypy --strict applies uniformly to all four layers, including
# tests: test functions are fully typed (e.g. `-> None`) rather than carving out a relaxed
# per-test-module override, since mypy's glob patterns can't match a `test_*` filename prefix
# (wildcards must fill a whole dotted component, not part of one).

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True

# Task P-06: boto3/botocore ship no py.typed marker and no bundled stubs (the full `boto3-stubs`
# package is a large, service-per-extra dependency disproportionate to the handful of S3 calls
# `media.infrastructure.object_storage` makes); piexif similarly ships no stubs and is test-only
# (constructs EXIF-bearing fixtures for the BRULE-12 stripping test). Confined to these two
# leaf/test dependencies, not a blanket ignore.
[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-piexif.*]
ignore_missing_imports = True

# Task P-13: pywebpush ships no py.typed marker/stubs either -- confined to
# notifications/infrastructure/providers/web_push.py (DEC-18).
[mypy-pywebpush.*]
ignore_missing_imports = True

# Task P-20: PyYAML ships no py.typed marker; `types-PyYAML` is a dev-only stub package this
# task's cross-cutting tests/ suite doesn't otherwise need -- confined to the one file that reads
# contracts/openapi.yaml directly (`tests/authorization/no_route_grants_access.py`), mirroring
# `tools/validate_openapi.py`'s own untyped `import yaml`.
[mypy-yaml.*]
ignore_missing_imports = True
