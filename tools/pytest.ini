# tools/pytest.ini -- QG-03 (Playbook Sec 16). Run: pytest -c tools/pytest.ini
[pytest]
minversion = 8.0
testpaths =
    apps/backend/tests
    packages/shared/tests
    contracts/tests
    tests
addopts = -ra --strict-markers --strict-config --import-mode=importlib
asyncio_mode = auto
# Invariant tests are test_I<nn>_*, requirement-traced tests are test_FR_*/test_NFR_*/test_BRULE_*
# (Playbook Sec 5 naming conventions). Markers below let CI select subsets if needed.
markers =
    invariant: test_I<nn>_* -- proves a domain invariant (DDD Sec 10.3)
    requirement: test_FR_*/test_NFR_*/test_BRULE_* -- traces to a specific requirement id
    integration: hits real PostgreSQL/Redis service containers, not mocks
