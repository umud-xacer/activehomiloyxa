[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "active-home-backend"
version = "0.0.0"
description = "Active Home FastAPI modular monolith -- 13 bounded-context modules (SAD Sec 7)."
requires-python = ">=3.13"
# Fixed technology stack (Baseline Sec 7, Enterprise-Technical-Task tech stack section). Direct
# dependencies pinned exactly (Playbook Sec 12 "Pin versions (lockfile) for reproducible
# builds"); a full transitive lockfile with hashes is generated by scripts/lock-deps.sh once
# there is code that actually exercises these packages -- see that script's docstring.
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "asyncpg==0.31.0",
    "redis==8.0.1",
    "boto3==1.43.44",
    "opensearch-py==3.2.0",
    "websockets==16.0",
    "python-multipart==0.0.32",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "pywebpush==2.3.0",
    "PyJWT[crypto]==2.13.0",
    "active-home-shared",
    "active-home-contracts",
]
# argon2-cffi (Task P-05): Security Architecture Sec 3.1 names Argon2id by name for password
# storage; the stdlib has no Argon2 implementation, so this is a necessary leaf dependency, not
# a discretionary architecture choice. httpx (Task P-05): the Eskiz SMS and Google OAuth
# provider adapters (DEC-18) each make outbound HTTPS calls; httpx was already a transitive
# dev/test dependency (FastAPI's TestClient) and is promoted to a runtime dependency here rather
# than adding a second HTTP client library. Pillow (Task P-06): media's `ImageProcessingPort`
# adapter (EXIF/GPS stripping, resize -- FR-MEDIA-003/005) needs an image codec library; the
# stdlib has none. ClamAV's malware-scan adapter needs no new dependency -- its INSTREAM wire
# protocol is small enough to speak directly over a raw `asyncio` socket (see
# `media/infrastructure/malware_scan.py`). pywebpush (Task P-13): `WebPushProviderPort`'s adapter
# (DEC-18) needs VAPID-signed, AES128GCM-encrypted payload delivery (RFC 8291/8292) -- the
# standard library has neither the ECDSA signing nor the payload encryption; this is the
# de-facto standard Python library for it (pulls in `cryptography`/`http-ece`/`py-vapid`
# transitively). Confined entirely to `notifications/infrastructure/providers/web_push.py`
# (DEC-18: no provider SDK type crosses the `infrastructure/` boundary). PyJWT[crypto]: Sign in
# with Apple's OAuth token endpoint requires a JWT `client_secret` (ES256, signed with the
# developer's Apple-issued private key) instead of a static string like Google's, and the
# `id_token` it returns must be verified (RS256) against Apple's published JWKS before its claims
# are trusted -- confined entirely to `identity/infrastructure/providers/apple_oauth.py`.

# STATUS: interface stubs only (Task P-01). No aggregates, use cases, or migrations yet -- see
# src/<module>/README.md per module. active-home-shared and active-home-contracts are path
# dependencies, installed editable alongside this package (scripts/dev-install.sh); no version
# pin is meaningful for them since they are built from this same monorepo, not fetched from an
# index.

[tool.setuptools.packages.find]
where = ["src"]
