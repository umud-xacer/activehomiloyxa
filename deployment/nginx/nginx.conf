# deployment/nginx/nginx.conf
#
# STATUS: skeleton only (Infra Sec 6). No api/web upstreams yet -- those are added, along with
# TLS termination (Infra Sec 5), when the api/web containers exist. For now this proves the
# edge container starts and is reachable, and gives docker-compose's healthcheck something real
# to probe.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        # IPv4-only here left the compose healthcheck's `wget http://localhost/healthz` failing
        # every time -- `localhost` resolves to ::1 first inside the container, nothing was
        # listening there, so the container ran fine but stayed permanently "unhealthy".
        listen [::]:80;
        server_name _;

        location /healthz {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # TODO(next infra task): TLS termination (443) + reverse-proxy upstreams for
        # api/web/realtime once those containers exist (Infra Sec 5, Sec 6).
        location / {
            add_header Content-Type text/plain;
            return 503 "active-home: no application containers deployed yet\n";
        }
    }
}
