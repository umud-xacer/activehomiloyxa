# deployment/nginx/activehome.conf -- system nginx site config for the single-host production
# topology (backend/frontend run as host-level systemd services, not containers; see
# docker-compose.production.yml's own header comment for why). Installed at
# /etc/nginx/sites-available/activehome.conf on the server, not consumed by Docker Compose.
#
# No TLS yet (DNS for activehome.uz is not pointed at this host); add a 443 server block with
# certbot-issued certs once it is.

server {
    listen 80;
    server_name activehome.uz www.activehome.uz 16.171.149.72 _;

    client_max_body_size 25m;

    # Basic clickjacking/MIME-sniffing/referrer-leak hardening, added 2026-08-19. HSTS and a real
    # Content-Security-Policy are deliberately NOT added yet: HSTS is unsafe to turn on while
    # Cloudflare SSL is still in Flexible mode (no TLS on the origin itself -- see CLAUDE.md's
    # open items), and a CSP needs a careful pass against every external origin this app actually
    # loads from (OSM/Esri/OpenTopoMap map tiles, Nominatim, OSRM routing, Yandex panorama links,
    # loremflickr category images) before it can be tightened without breaking something live --
    # do NOT add a guessed CSP here without testing it against a real page load first. Nginx only
    # inherits `add_header` into a location that defines none of its own, so these are repeated
    # inside /healthz below rather than relying on inheritance.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /healthz {
        add_header Content-Type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    # Backend API -- same-origin /api/v1 prefix, matching apps/frontend's own dev-time proxy
    # convention (next.config.ts / VITE_API_BASE_URL), just terminated by nginx instead of Vite
    # in this deployment.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media (listing photos/videos, banner creatives) -- proxies MinIO's S3-compatible HTTP API
    # instead of exposing its raw :9000 port directly to the internet (that port previously being
    # reachable at all is what an AWS Security Group tightening broke, taking every image on the
    # site down with it). `MEDIA_CDN_BASE_URL` (backend env) must point here
    # (https://activehome.uz/media-cdn), matching the bucket name in `MINIO_MEDIA_BUCKET`.
    location /media-cdn/ {
        proxy_pass http://127.0.0.1:9000/active-home-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Presigned direct-upload passthrough (`MINIO_PUBLIC_ENDPOINT_URL`, media module's
    # `MinioStorageAdapter`) -- a browser PUTs bytes straight here. boto3's presigned PUT URL
    # embeds the bucket name (path-style S3 addressing, `{endpoint}/{bucket}/{key}?
    # X-Amz-Signature=...`), and that exact path/host pair is baked into the SigV4 signature --
    # MinIO recomputes the signature from whatever path it actually receives, so this MUST be a
    # true 1:1 forward, no prefix stripped or added.
    #
    # Real bug found live (2026-08-14): an earlier version of this block used the literal prefix
    # `/media-upload/` as BOTH the nginx location AND the `MINIO_PUBLIC_ENDPOINT_URL` path suffix,
    # with `proxy_pass http://127.0.0.1:9000/;` (note the trailing slash). That trailing slash is
    # exactly what makes nginx STRIP the matched location prefix and substitute it with `/` --
    # the opposite of the "pure 1:1, no rewrite" comment that used to sit here. MinIO then verified
    # the signature against `/active-home-media/{key}` (what it received) while boto3 had signed
    # `/media-upload/active-home-media/{key}` (what `MINIO_PUBLIC_ENDPOINT_URL` produced) --
    # `SignatureDoesNotMatch` on every single upload, site-wide, confirmed via `curl` straight
    # against MinIO's own :9000 port from the host (bypassing nginx entirely) both ways: the
    # stripped path 403'd, and the *original unstripped* path passed signature verification but
    # then 404'd with `NoSuchBucket` (MinIO read "media-upload" as the bucket name instead of
    # "active-home-media") -- proving the fix has to remove the extra path segment altogether, not
    # just stop stripping it. Fixed by matching this location on the REAL bucket name
    # (`active-home-media`) instead of an arbitrary `/media-upload/` label, `MINIO_PUBLIC_ENDPOINT_
    # URL` trimmed to the bare origin (`https://activehome.uz`, no path suffix), and `proxy_pass`
    # given NO trailing slash (the actual "don't rewrite the path" nginx syntax -- a bare `http://
    # host:port;` passes the incoming URI through completely unchanged, `http://host:port/;` does
    # not).
    location /active-home-media/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (TanStack Start SSR/Node server) -- everything else, including SSR page loads and
    # its own client-asset chunks.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
