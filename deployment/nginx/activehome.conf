# deployment/nginx/activehome.conf -- system nginx site config for the single-host production
# topology (backend/frontend run as host-level systemd services, not containers; see
# docker-compose.production.yml's own header comment for why). Installed at
# /etc/nginx/sites-available/activehome.conf on the server, not consumed by Docker Compose.
#
# No TLS yet (DNS for activehome.uz is not pointed at this host); add a 443 server block with
# certbot-issued certs once it is.

server {
    listen 80;
    server_name activehome.uz www.activehome.uz 16.171.149.72 _;

    client_max_body_size 25m;

    location /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Backend API -- same-origin /api/v1 prefix, matching apps/frontend's own dev-time proxy
    # convention (next.config.ts / VITE_API_BASE_URL), just terminated by nginx instead of Vite
    # in this deployment.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media (listing photos/videos, banner creatives) -- proxies MinIO's S3-compatible HTTP API
    # instead of exposing its raw :9000 port directly to the internet (that port previously being
    # reachable at all is what an AWS Security Group tightening broke, taking every image on the
    # site down with it). `MEDIA_CDN_BASE_URL` (backend env) must point here
    # (https://activehome.uz/media-cdn), matching the bucket name in `MINIO_MEDIA_BUCKET`.
    location /media-cdn/ {
        proxy_pass http://127.0.0.1:9000/active-home-media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Presigned direct-upload passthrough (`MINIO_PUBLIC_ENDPOINT_URL`, media module's
    # `MinioStorageAdapter`) -- a browser PUTs bytes straight here. Unlike /media-cdn/ above, this
    # does NOT rewrite the path: boto3's presigned PUT URL already embeds the bucket name
    # (path-style S3 addressing, `{endpoint}/{bucket}/{key}?X-Amz-Signature=...`), and that exact
    # path/host pair is baked into the SigV4 signature -- MinIO would reject the request if nginx
    # altered either, so this is a pure 1:1 forward, no prefix stripped or added.
    location /media-upload/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (TanStack Start SSR/Node server) -- everything else, including SSR page loads and
    # its own client-asset chunks.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
