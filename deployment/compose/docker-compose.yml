# deployment/compose/docker-compose.yml
#
# Datastore + edge topology (Infra Sec 6, Sec 7), plus (Task P-10) the FIRST application
# container: `realtime` (the WebSocket chat gateway, DEC-11). `api`/`web`/`worker` containers for
# every other module remain out of scope -- they arrive with their own Dockerfiles once the task
# that first needs them builds one (Task P-00's own "no application containers yet" no longer
# holds universally, but still holds for those three). `nginx` still serves only a static health
# response for the `api`/`web` upstreams (not yet built); its own reverse-proxy block for
# `realtime`'s WSS upgrade is deployment/nginx/nginx.conf's own TODO, tracked there, not solved
# in this task (no TLS termination exists yet either, Infra Sec 5). `clamav` (Task P-06) is the
# one addition since P-00 before this: a backing service (like postgres/redis/opensearch/minio,
# not an application container) that media's `MalwareScanPort` adapter needs and no prior module
# did.
#
# Run: docker compose -f deployment/compose/docker-compose.yml up -d
# Validate only: docker compose -f deployment/compose/docker-compose.yml config

name: active-home

networks:
  active-home:
    driver: bridge

volumes:
  pgdata:
  redis-data:
  opensearch-data:
  minio-data:
  clamav-data:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-active_home}
      POSTGRES_USER: ${POSTGRES_USER:-active_home}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-active_home_local_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: [active-home]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-active_home} -d ${POSTGRES_DB:-active_home}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 12g

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: [active-home]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    networks: [active-home]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 6g

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-active_home}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-active_home_local_dev_only}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [active-home]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  clamav:
    # Task P-06: media's `MalwareScanPort` adapter (DDD Sec 5.6) needs a malware scanner --
    # named alongside MinIO/CDN as infra to provision (Enterprise Technical Task Sec 4: "MinIO,
    # malware scanner, CDN") but not yet in this file (Task P-00 provisioned only the
    # datastores its own scope covered). ClamAV is the self-hosted choice (no per-scan external
    # API cost/latency, matches DEC-17 cloud-agnostic self-hosting).
    # Pinned to the exact patch release, not the floating `1.4-stable` alias -- that alias was
    # retired from Docker Hub (only `1.4`, `1.4.5`, `1.4-debian`, etc. remain) and `docker compose
    # up` now fails with "manifest unknown" until this is a tag that still resolves.
    image: clamav/clamav:1.4.5
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    networks: [active-home]
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 3 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2g

  realtime:
    # Task P-10, DEC-11: the stateful WebSocket chat gateway -- Infra Sec 6's own container
    # table ("realtime | python:3.13-slim + FastAPI | ... | Private; reached via nginx (WSS)").
    # No published host port: private network only, reached only through nginx (once that
    # reverse-proxy block exists -- deployment/nginx/nginx.conf's own TODO).
    build:
      context: ../..
      dockerfile: deployment/docker/realtime.Dockerfile
    restart: unless-stopped
    environment:
      ENV_NAME: ${ENV_NAME:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-active_home}
      POSTGRES_USER: ${POSTGRES_USER:-active_home}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-active_home_local_dev_only}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-ah_session}
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?SESSION_SIGNING_KEY must be set}
    networks: [active-home]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    networks: [active-home]
    depends_on:
      - postgres
      - redis
      - opensearch
      - minio
      - realtime
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
