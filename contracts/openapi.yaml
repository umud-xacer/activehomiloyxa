      description: A scheduled, targeted banner engagement occupying a configured Placement Slot
        (DDD Sec 5.9). References its slot/creative/entitlement by identifier only — never a
        duplicated copy of another module's state. Carries no impression/click counters (Database
        Architecture's counters-correction note; I-23) — those are BannerImpressionRecorded/
        BannerClickRecorded metric events only.
      required:
      - id
      - slotKey
      - creativeMediaAssetId
      - entitlementId
      - scheduleStart
      - scheduleEnd
      - priority
      - targeting
      - status
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slotKey:
          type: string
          description: References a configuration PlacementSlotDefinition by SlotKey (BC-04).
        creativeMediaAssetId:
          type: string
          format: uuid
          description: References a media MediaAssetRef by identifier (BC-06). Must be Clean/not
            quarantined (I-20) to ever be served.
        entitlementId:
          type: string
          format: uuid
          description: References a billing Entitlement (entitlementType=BANNER_SLOT_BOOKING) by
            identifier (BC-08). Must be ACTIVE (I-15/I-21).
        scheduleStart:
          type: string
          format: date-time
        scheduleEnd:
          type: string
          format: date-time
        priority:
          type: integer
          minimum: 0
        targeting:
          type: object
          description: Basic targeting (FR-BANNER-003) — category/geo/language, all optional (unset
            = untargeted on that dimension).
          properties:
            categoryIds:
              type: array
              items:
                type: string
                format: uuid
            geo:
              type:
              - string
              - 'null'
            languages:
              type: array
              items:
                type: string
                enum:
                - uz_latn
                - uz_cyrl
                - ru
                - en
          additionalProperties: false
        status:
          type: string
          enum:
          - DRAFT
          - SCHEDULED
          - RUNNING
          - PAUSED
          - ENDED
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
