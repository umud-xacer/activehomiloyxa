      operationId: startConversation
      summary: Start a conversation
      description: 'Initiates a two-party conversation about a listing with a first message (FR-MSG-001;
        I-19 exactly

        two participants). Blocked pairs are refused. Realtime delivery is over WebSocket; this REST

        surface persists and returns history. **Rate limiting:** per-user messaging rate limit (BR-MSG-03).

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      responses:
        '201':
          description: Conversation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /conversations/{conversationId}:
    get:
      tags:
      - Messaging
      operationId: getConversation
      summary: Get a conversation
      parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/messages:
    get:
      tags:
      - Messaging
      operationId: listMessages
      summary: List messages in a conversation
      description: Returns the message history (FR-MSG-002), oldest-first with cursor paging.
      parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of messages.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Messaging
      operationId: sendMessage
      summary: Send a message
      description: 'Appends a message. Note on **attachments:** v1 messaging is text-only per the approved
        domain

        (Message VO carries body/timestamp/status; no attachment entity exists). This operation therefore

        accepts text; image sharing is not a v1 capability (reconciliation vs the brief''s "Attachments").

        Blocked pairs are refused. Rate-limited (BR-MSG-03).

        '
      parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreateRequest'
      responses:
        '201':
          description: Message sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /conversations/{conversationId}/phone-reveal:
    post:
      tags:
      - Messaging
      operationId: revealPhone
      summary: Reveal the counterpart's phone number
      description: 'Returns the counterpart phone number if the owner''s privacy settings permit (click-to-call,

        BRULE-13); otherwise `allowed:false`. Emits a PhoneRevealed metric.

        '
      parameters:
      - $ref: '#/components/parameters/ConversationIdPath'
      responses:
        '200':
          description: Reveal outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneRevealResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/blocks:
    get:
      tags:
      - Messaging
      operationId: listBlocks
      summary: List blocked users
      responses:
        '200':
          description: Blocks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Block'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
