        in: query
        schema:
          type: string
          enum:
          - SUBSCRIPTION
          - PREMIUM
          - FEATURED
          - TOP_PLACEMENT
          - VERIFICATION
          - BANNER_PLACEMENT
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
  /orders:
    get:
