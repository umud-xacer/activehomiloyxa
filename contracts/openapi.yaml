  /admin/campaigns:
    get:
      tags:
      - Ads
      operationId: listCampaigns
      summary: List banner campaigns (operator)
      description: Operator campaign queue (FR-BANNER-002). Requires the ads campaign-management
        permission key.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - SCHEDULED
          - RUNNING
          - PAUSED
          - ENDED
      - name: slotKey
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of campaigns.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Ads
      operationId: createCampaign
      summary: Create a banner campaign (operator)
      description: Creates a campaign in DRAFT (FR-BANNER-002/003). Slot, creative, targeting,
        and entitlement are references by identifier only — resolved from configuration/media/billing
        via their own events/interfaces, never duplicated here.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerCampaignCreateRequest'
      responses:
        '201':
          description: Campaign created (DRAFT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/campaigns/{campaignId}:
    get:
      tags:
      - Ads
      operationId: getCampaign
      summary: Get a banner campaign (operator)
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      responses:
        '200':
          description: Campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Ads
      operationId: updateCampaign
      summary: Update a banner campaign (operator)
      description: Mutates schedule/targeting/creative/priority while the campaign is still DRAFT
        (FR-BANNER-002/003). Illegal once scheduled.
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BannerCampaignUpdateRequest'
      responses:
        '200':
          description: Updated campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/campaigns/{campaignId}/schedule:
    post:
      tags:
      - Ads
      operationId: scheduleCampaign
      summary: Schedule a banner campaign (operator)
      description: DRAFT -> SCHEDULED. Validates slot, targeting, and entitlement-active (I-21,
        deferring only the "currently within schedule" clause to serve time). Emits BannerCampaignScheduled.
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Campaign scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/campaigns/{campaignId}/pause:
    post:
      tags:
      - Ads
      operationId: pauseCampaign
      summary: Pause a banner campaign (operator)
      description: SCHEDULED/RUNNING -> PAUSED. No domain event — the frozen event catalogue names
        only Scheduled/Started/Ended.
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Campaign paused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/campaigns/{campaignId}/resume:
    post:
      tags:
      - Ads
      operationId: resumeCampaign
      summary: Resume a paused banner campaign (operator)
      description: PAUSED -> SCHEDULED or RUNNING depending on the current time vs. the schedule
        window. No domain event, same reason as pause.
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Campaign resumed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/campaigns/{campaignId}/end:
    post:
      tags:
      - Ads
      operationId: endCampaign
      summary: End a banner campaign early (operator)
      description: SCHEDULED/RUNNING/PAUSED -> ENDED. Emits BannerCampaignEnded (same event a natural
        schedule-end sweep emits).
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Campaign ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerCampaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /banners/serve:
    get:
      tags:
      - Ads
      operationId: serveBanner
      summary: Select and serve an eligible banner (public)
      description: 'Selects the single highest-priority campaign eligible under I-21 (within schedule,
        matching targeting, in the requested slot, entitlement active) and I-20 (creative not quarantined)
        for the given slot/context. Fast, read-only, never blocks on another bounded context —
        entitlement/creative status are read from this module''s own local projections, never a
        live cross-module call. No session required.

        '
      security: []
      parameters:
      - name: slotKey
        in: query
        required: true
        schema:
          type: string
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
      - name: geo
        in: query
        schema:
          type: string
      - name: language
        in: query
        schema:
          type: string
          enum:
          - uz_latn
          - uz_cyrl
          - ru
          - en
      responses:
        '200':
          description: An eligible banner was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BannerServeView'
        '204':
          description: No eligible campaign for this slot/context right now.
  /banners/{campaignId}/impressions:
    post:
      tags:
      - Ads
      operationId: recordBannerImpression
      summary: Record a banner impression (public)
      description: Fired by the client when a served banner actually renders (FR-BANNER-005). Emits
        BannerImpressionRecorded as a metric event only — no counter is stored on the campaign
        (Database Architecture's counters-correction note).
      security: []
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Impression recorded.
        '404':
          $ref: '#/components/responses/NotFound'
  /banners/{campaignId}/clicks:
    post:
      tags:
      - Ads
      operationId: recordBannerClick
      summary: Record a banner click (public)
      description: Fired by the client on click-through (FR-BANNER-005). Emits BannerClickRecorded
        as a metric event only — no counter is stored on the campaign.
      security: []
      parameters:
      - $ref: '#/components/parameters/CampaignIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Click recorded.
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/config/{entityType}:
    get:
      tags:
      - Configuration (Admin)
      operationId: listConfigHeads
      summary: List configuration heads of a type
      description: 'Lists configuration heads for an entity family (categories, forms, products, placement-slots,

        roles, search-config, notification-templates, platform-settings). One uniform surface serves all

        eight (Head+Version pattern, DM-03). Requires the relevant manage-configuration permission key.

        '
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of configuration heads.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ConfigurationHead'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Configuration (Admin)
      operationId: createConfigDraft
      summary: Create a configuration entity (draft)
      description: 'Creates a new head with an initial draft version. The draft is not consumer-visible
        until

        published. Whitelist and dependency validation are enforced at publish, not here.

        '
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDraftRequest'
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/config/{entityType}/{headId}:
    get:
      tags:
      - Configuration (Admin)
      operationId: getConfigHead
      summary: Get a configuration head with its versions
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      responses:
        '200':
          description: The head (with version summaries).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationHead'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/config/{entityType}/{headId}/versions:
    get:
      tags:
      - Configuration (Admin)
      operationId: listConfigVersions
      summary: List versions of a configuration entity
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      responses:
        '200':
          description: Versions (immutable history).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Configuration (Admin)
      operationId: createConfigVersionDraft
      summary: Create a new draft version
      description: Creates a new draft version on an existing head (edit cycle). Published versions are
        immutable.
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDraftRequest'
      responses:
        '201':
          description: Draft version created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/config/{entityType}/{headId}/versions/{versionId}:
    get:
      tags:
      - Configuration (Admin)
      operationId: getConfigVersion
      summary: Get a configuration version
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      - $ref: '#/components/parameters/ConfigVersionIdPath'
      responses:
        '200':
          description: The version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Configuration (Admin)
      operationId: updateConfigDraft
      summary: Edit a draft version
      description: Edits a DRAFT version's definition document. Rejected 409 if the version is already
        PUBLISHED (immutable).
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      - $ref: '#/components/parameters/ConfigVersionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigurationDraftRequest'
      responses:
        '200':
          description: Updated draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/config/{entityType}/{headId}/versions/{versionId}/validate:
    post:
      tags:
      - Configuration (Admin)
      operationId: validateConfigVersion
      summary: Validate a version (dry run)
      description: 'Runs the full pre-activation validation gate (whitelist membership, dependencies,
        cycles,

        translation completeness, dates, duplicate codes, safety) without publishing. Returns a structured

        pass/fail (Config Framework §9).

        '
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      - $ref: '#/components/parameters/ConfigVersionIdPath'
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigValidationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/config/{entityType}/{headId}/versions/{versionId}/publish:
    post:
      tags:
      - Configuration (Admin)
      operationId: publishConfigVersion
      summary: Publish a version
      description: 'Freezes the draft into an immutable version, moves the Current pointer, writes the
        snapshot, emits

        ConfigurationChanged, and records an audit entry — one transaction + outbox (Config Framework

        §2.4). Controlled-track entities (roles, settings) require prior maker–checker approval

        (Super-Admin). Re-enters the validation gate; publish is refused if validation fails.

        '
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      - $ref: '#/components/parameters/ConfigVersionIdPath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPublishRequest'
      responses:
        '200':
          description: Published (now Current).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Validation gate failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /admin/config/{entityType}/{headId}/rollback:
    post:
      tags:
      - Configuration (Admin)
      operationId: rollbackConfig
      summary: Roll back to a prior version
      description: 'Re-publishes a prior version''s content as a **new** version (history is never rewritten),

        re-entering the validation gate (Config Framework §2.6). Refused if the target content fails

        validation against current dependencies.

        '
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRollbackRequest'
      responses:
        '200':
          description: Rolled back (new Current version created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/config/{entityType}/{headId}/versions/compare:
    get:
      tags:
      - Configuration (Admin)
      operationId: compareConfigVersions
      summary: Compare two versions
      description: Returns a structured diff between two versions (or draft vs current) for impact review.
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Structured diff.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/config/{entityType}/{headId}/export:
    get:
      tags:
      - Configuration (Admin)
      operationId: exportConfig
      summary: Export a configuration definition
      description: Exports a version's definition document as portable data (e.g. to move between environments).
        Read of the definition document.
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      - $ref: '#/components/parameters/ConfigHeadIdPath'
      - name: versionId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Exported definition document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/config/{entityType}/import:
    post:
      tags:
      - Configuration (Admin)
      operationId: importConfig
      summary: Import a configuration definition
      description: 'Imports a definition document as a new draft. Import **always re-enters the validation
        gate**;

        nothing bypasses the whitelist/dependency checks (I-16, Config Framework §8.3).

        '
      parameters:
      - $ref: '#/components/parameters/ConfigEntityTypePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - definition
              properties:
                definition:
                  type: object
                  additionalProperties: true
              additionalProperties: false
      responses:
        '201':
          description: Imported as a new draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationVersion'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /admin/dashboard:
    get:
      tags:
      - Administration
      operationId: getAdminDashboard
      summary: Admin dashboard summary
      description: Operational KPIs composed over modules (rebuildable projections). Requires an operator
        role.
      responses:
        '200':
          description: Dashboard summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/moderation-queue:
    get:
      tags:
      - Administration
      operationId: listModerationQueue
      summary: List moderation cases
      description: The moderation work queue (FR-MOD-005). Filterable by status and subject type.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - IN_REVIEW
          - RESOLVED
      - name: subjectType
        in: query
        schema:
          type: string
          enum:
          - LISTING
          - CONVERSATION
          - USER
          - PROFILE
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of moderation cases.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ModerationCase'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/moderation-queue/{caseId}:
    get:
      tags:
      - Administration
      operationId: getModerationCase
      summary: Get a moderation case
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/moderation-queue/{caseId}/action:
    post:
      tags:
      - Administration
      operationId: applyModerationAction
      summary: Resolve a moderation case
      description: 'Applies one verb from the closed set (BR-MOD-02). The action is issued as a command
        to the target

        module (the target owns its state change) and recorded as an immutable audit entry (I-22).

        '
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationActionRequest'
      responses:
        '200':
          description: Case resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/verification-queue:
    get:
      tags:
      - Administration
      operationId: listVerificationQueue
      summary: List verification cases
      description: The manual verification reviewer queue with SLA (DEC-13).
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - REQUESTED
          - IN_REVIEW
          - APPROVED
          - REJECTED
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of verification cases.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/VerificationCase'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/verification-queue/{caseId}/decision:
    post:
      tags:
      - Administration
      operationId: decideVerification
      summary: Decide a verification case
      description: Approves or rejects a verification case (FR-PROF-005). Approval issues the badge with
        validity terms (I-13).
      parameters:
      - name: caseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationDecisionRequest'
      responses:
        '200':
          description: Decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/users:
    get:
      tags:
      - Administration
      operationId: adminListUsers
      summary: List users (admin)
      description: Administrative user search/listing. Requires user-management permission.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
      - name: query
        in: query
        schema:
          type: string
          description: Phone/email/name partial.
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/UserAdminView'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{userId}/status:
    post:
      tags:
      - Administration
      operationId: adminChangeUserStatus
      summary: Suspend or reactivate a user
      description: Suspends or reactivates an account (emits AccountSuspended; catalog hides listings
        via events). Audited.
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusChangeRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminView'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{userId}/roles:
    post:
      tags:
      - Administration
      operationId: assignRole
      summary: Assign a role to a user
      description: Assigns a published RoleDefinition to a user account, pinning the identity +
        the exact published version at assignment time (Config Framework Sec 7.2). Audited
        (ADR-0006).
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/users/{userId}/roles/{roleDefinitionHeadId}:
    delete:
      tags:
      - Administration
      operationId: revokeRole
      summary: Revoke a role from a user
      description: Revokes a previously-assigned RoleDefinition from a user account (ADR-0006).
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: roleDefinitionHeadId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: actingProfileId
        in: query
        schema:
          type:
          - string
          - 'null'
          format: uuid
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/registration-queue:
    get:
      tags:
      - Administration
      operationId: listRegistrationQueue
      summary: List accounts pending registration review
      description: ADR-0007. PENDING accounts, oldest-first, with their full signup anketa.
        Gated by identity:registration:review.
      parameters:
      - name: cursor
        in: query
        schema:
          type:
          - string
          - 'null'
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: A page of pending registrations.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/RegistrationQueueItem'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/registration-queue/{accountId}/decision:
    post:
      tags:
      - Administration
      operationId: decideRegistration
      summary: Approve or reject a pending registration
      description: ADR-0007. Terminal -- an account's registration review can only be decided
        once. Gated by identity:registration:review.
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationDecisionRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminView'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/billing/invoices:
    get:
      tags:
      - Administration
      operationId: adminListInvoices
      summary: List invoices (admin)
      description: Billing operator queue — invoices awaiting offline payment confirmation.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ISSUED
          - PAID
          - VOID
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of invoices.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/billing/invoices/{invoiceId}/confirm-payment:
    post:
      tags:
      - Administration
      operationId: confirmInvoicePayment
      summary: Confirm offline payment
      description: 'Records operator confirmation of an offline payment (FR-BILL-002). Marks the invoice
        PAID and

        activates the order''s entitlements (I-14) — the sanctioned synchronous payment→entitlement step.

        Audited.

        '
      parameters:
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmationRequest'
      responses:
        '200':
          description: Payment confirmed; entitlements activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/audit-log:
    get:
      tags:
      - Administration
      operationId: queryAuditLog
      summary: Query the audit log
      description: 'Filterable, append-only administrative/moderation/configuration action trail (FR-AUDIT-002,
        I-22).

        Read-only — audit entries are never mutated or deleted.

        '
      parameters:
      - name: actorUserId
        in: query
        schema:
          type: string
          format: uuid
      - name: targetType
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit entries.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AuditEntry'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reports:
    get:
      tags:
      - Administration
      operationId: getAdminReports
      summary: Operational reports
      description: Returns a report dataset from the fixed v1 report set (FR-ADMIN-005). Rebuildable projections.
      parameters:
      - name: report
        in: query
        required: true
        schema:
          type: string
          enum:
          - LISTINGS_OVERVIEW
          - USER_GROWTH
          - REVENUE
          - VERIFICATION_SLA
          - MODERATION_THROUGHPUT
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Report dataset.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ah_session
      description: 'First-party, server-side session (Redis-backed, SAD §13). Issued by any auth flow
        and sent as a

        secure, HttpOnly, SameSite=Lax cookie. This is the default scheme for browser clients.

        '
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'The same first-party session token presented as `Authorization: Bearer <token>` for
        native and

        mobile clients that cannot use cookies. The token is an **opaque server-side session reference**,

        not a JWT. Revoking the session (logout) invalidates it immediately.

        '
    googleOAuth:
      type: oauth2
      description: 'Google is a federated **sign-in** identity provider only (authorization-code flow).
        After Google

        authenticates the user, Active Home links or creates the account and issues its own first-party

        session (`sessionCookie`/`sessionBearer`). Active Home does not expose an OAuth2 authorization

        server of its own.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            openid: OpenID Connect sign-in
            email: Verified email (used to link, never duplicate, an existing account)
            profile: Basic profile
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque forward cursor from a previous page's `nextCursor`. Omit for the first page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Values above the maximum are clamped, not rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Fields:
      name: fields
      in: query
      required: false
      description: 'Comma-separated sparse-fieldset projection. Field selection never widens authorization.

        '
      schema:
        type: string
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred display locale for resolved `LocalizedText` where a resolved form is returned.
      schema:
        type: string
        enum:
        - uz-Latn
        - uz-Cyrl
        - ru
        - en
        default: uz-Latn
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Client-generated key (UUID recommended) making a side-effecting POST safe to retry.
        The first

        successful result is replayed for subsequent identical requests.

        '
      schema:
        type: string
        format: uuid
    ActingProfile:
      name: X-Acting-Profile
      in: header
      required: false
      description: 'The business profile id to act as for this request (multi-profile ownership, FR-USER-002).
        Omit

        to act in personal context. Must be a profile the session''s account owns, or the request is 403.

        '
      schema:
        type: string
        format: uuid
    ListingIdPath:
      name: listingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CampaignIdPath:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProfileIdPath:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationIdPath:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryIdPath:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MediaIdPath:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConfigEntityTypePath:
      name: entityType
      in: path
      required: true
      description: The configuration entity family being authored.
      schema:
        type: string
        enum:
        - category
        - form-definition
        - product-definition
        - placement-slot
        - role-definition
        - search-configuration
        - notification-template
        - platform-settings
    ConfigHeadIdPath:
      name: headId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConfigVersionIdPath:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    RateLimitLimit:
      description: Request quota for the current window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining requests in the current window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix epoch seconds when the window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying (rate limit or temporary degradation).
      schema:
        type: integer
    Deprecation:
      description: RFC-8594 deprecation signal for a deprecated operation or field.
      schema:
        type: string
    Sunset:
      description: RFC-8594 date after which a deprecated element may be removed (only in a new major
        version).
      schema:
        type: string
        format: date-time
  responses:
    BadRequest:
      description: Malformed request or failed transport-schema validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            malformed:
              $ref: '#/components/examples/ErrValidation'
    Unauthorized:
      description: No valid session, or session expired/revoked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noSession:
              $ref: '#/components/examples/ErrUnauthorized'
    Forbidden:
      description: Authenticated but not permitted (default-deny; wrong acting profile; insufficient permission
        key).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            denied:
              $ref: '#/components/examples/ErrForbidden'
    NotFound:
      description: Resource does not exist or is not visible to the caller (opaque).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/ErrNotFound'
    Conflict:
      description: Optimistic-concurrency conflict, duplicate unique key, or illegal state transition.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            conflict:
              $ref: '#/components/examples/ErrConflict'
    UnprocessableEntity:
      description: Business-rule violation or field-level validation failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              $ref: '#/components/examples/ErrValidation'
            businessRule:
              $ref: '#/components/examples/ErrBusinessRule'
    TooManyRequests:
      description: Rate limit exceeded (edge, OTP throttle, or messaging rate limit).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/ErrRateLimited'
    ServiceDegraded:
      description: A downstream dependency is degraded; a reduced result or retry hint is returned (search→DB,
        chat→click-to-call, config→last-good snapshot).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            degraded:
              $ref: '#/components/examples/ErrDegraded'
  schemas:
    LocalizedText:
      type: object
      description: 'User-visible text across the four locales (DB PD-03). `uz_latn` is the canonical Uzbek;
        the

        others are optional depending on what was authored. Cross-script Uzbek matching is handled by

        the search engine, not by stored transliteration.

        '
      properties:
        uz_latn:
          type: string
        uz_cyrl:
          type: string
        ru:
          type: string
        en:
          type: string
      additionalProperties: false
      examples:
      - uz_latn: Kvartira
        ru: Квартира
        en: Apartment
    Money:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: string
          description: Decimal string, 2 dp (avoids float error).
          examples:
          - '1500000.00'
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: UZS
          examples:
          - UZS
      additionalProperties: false
    GeoPoint:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
      additionalProperties: false
    AttributeMap:
      type: object
      description: 'The dynamic listing attributes (the AttributeSet, DM-02) — typed values keyed by the
        field

        `code` of the bound FormDefinition version. This stable envelope is why adding form fields is
        a

        configuration change, never an API change.

        '
      additionalProperties: true
      examples:
      - rooms: 3
        area_m2: 72.5
        floor: 5
        has_balcony: true
    CursorPage:
      type: object
      description: Cursor pagination envelope (opaque forward cursor).
      required:
      - items
      - page
      properties:
        items:
          type: array
          items: {}
        page:
          type: object
          required:
          - limit
          properties:
            limit:
              type: integer
            nextCursor:
              type:
              - string
              - 'null'
              description: Pass as `cursor` to fetch the next page; null when exhausted.
            total:
              type:
              - integer
              - 'null'
              description: Present only where cheap to compute; may be null.
      additionalProperties: false
    Error:
      type: object
      description: 'Single Problem-style error envelope (RFC-9457 shaped). `code` is a stable, machine-readable

        member of a closed vocabulary and refines the HTTP status.

        '
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type.
          examples:
          - https://errors.activehome.uz/validation
        title:
          type: string
          description: Short, human-readable summary.
        status:
          type: integer
          description: HTTP status code.
        code:
          type: string
          description: Stable application-level error code.
          enum:
          - VALIDATION_FAILED
          - BUSINESS_RULE_VIOLATION
          - AUTHENTICATION_REQUIRED
          - AUTHENTICATION_INVALID
          - SESSION_EXPIRED
          - PERMISSION_DENIED
          - WRONG_ACTING_PROFILE
          - RESOURCE_NOT_FOUND
          - CONFLICT
          - DUPLICATE_KEY
          - ILLEGAL_STATE_TRANSITION
          - QUOTA_EXCEEDED
          - IMAGE_COUNT_EXCEEDED
          - UNSUPPORTED_MEDIA_TYPE
          - IDEMPOTENCY_KEY_REUSED
          - RATE_LIMITED
          - OTP_THROTTLED
          - DEPENDENCY_DEGRADED
        detail:
          type: string
          description: Human-readable explanation for this occurrence.
        instance:
          type: string
          format: uri
          description: URI reference for this specific occurrence.
        traceId:
          type: string
          description: Correlation id for support and logs.
        details:
          type: array
          description: Field-level errors (validation and business-rule cases).
          items:
            $ref: '#/components/schemas/ValidationError'
      additionalProperties: false
    ValidationError:
      type: object
      required:
      - path
      - rule
      - message
      properties:
        path:
          type: string
          description: JSON pointer / field path.
          examples:
          - /attributes/area_m2
        rule:
          type: string
          description: The whitelisted validator or schema rule that failed.
          examples:
          - numeric_range
        message:
          type: string
      additionalProperties: false
    Account:
      type: object
      description: The authenticated user's own account (BC-01 UserAccount).
      required:
      - id
      - status
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phoneNumber:
          type:
          - string
          - 'null'
          description: E.164; null after anonymisation.
        email:
          type:
          - string
          - 'null'
          format: email
        displayName:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
          readOnly: true
        privacySettings:
          $ref: '#/components/schemas/PrivacySettings'
        notificationPreferences:
          $ref: '#/components/schemas/NotificationPreferences'
        ownedProfileIds:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        roles:
          type: array
          readOnly: true
          items:
            type: string
            description: Role codes assigned to the account.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        accountKind:
          type:
          - string
          - 'null'
          enum:
          - INDIVIDUAL
          - LEGAL_ENTITY
          - INVESTOR
          - null
          readOnly: true
          description: ADR-0007. The role chosen at signup.
        reviewStatus:
          type:
          - string
          - 'null'
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - null
          readOnly: true
          description: ADR-0007. Gates the role-specific workspace only -- login itself is
            governed by status, unchanged.
        reviewReason:
          type:
          - string
          - 'null'
          readOnly: true
          description: The reviewer's note, once reviewStatus is APPROVED/REJECTED.
      additionalProperties: false
    PrivacySettings:
      type: object
      properties:
        phoneRevealMode:
          type: string
          enum:
          - ALWAYS
          - ON_REQUEST
          - NEVER
          default: ON_REQUEST
          description: BRULE-13 phone-reveal gating.
      additionalProperties: false
    NotificationPreferences:
      type: object
      description: 'Channel opt-ins by category. OTP is always delivered via SMS (Eskiz) regardless of
        preference.

        '
      properties:
        email:
          type: boolean
          default: true
        webPush:
          type: boolean
          default: false
        sms:
          type: boolean
          default: true
      additionalProperties: false
    Session:
      type: object
      description: An authenticated session (BC-01 Session).
      required:
      - id
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actingProfileId:
          type:
          - string
          - 'null'
          format: uuid
          description: null = personal context.
        ipAddress:
          type:
          - string
          - 'null'
        userAgent:
          type:
          - string
          - 'null'
        current:
          type: boolean
          description: True for the session making this request.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        expiresAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    RegisterPhoneRequest:
      type: object
      required:
      - phoneNumber
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          examples:
          - '+998901234567'
      additionalProperties: false
    RegisterEmailRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
        displayName:
          type: string
          maxLength: 120
        accountKind:
          type: string
          enum:
          - INDIVIDUAL
          - LEGAL_ENTITY
          - INVESTOR
          default: INDIVIDUAL
          description: ADR-0007. The role chosen in the sign-up wizard's first step.
        anketa:
          type: object
          additionalProperties: true
          description: ADR-0007. Role-specific questionnaire answers from the wizard's second
            step. Freeform -- shape depends on accountKind.
      additionalProperties: false
    OtpRequest:
      type: object
      required:
      - phoneNumber
      - purpose
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        purpose:
          type: string
          enum:
          - REGISTRATION
          - LOGIN
          - RECOVERY
      additionalProperties: false
    OtpVerifyRequest:
      type: object
      required:
      - phoneNumber
      - code
      - purpose
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        code:
          type: string
          pattern: ^[0-9]{4,8}$
          writeOnly: true
        purpose:
          type: string
          enum:
          - REGISTRATION
          - LOGIN
          - RECOVERY
        accountKind:
          type: string
          enum:
          - INDIVIDUAL
          - LEGAL_ENTITY
          - INVESTOR
          default: INDIVIDUAL
          description: ADR-0007. Only consulted when purpose=REGISTRATION and no account exists
            yet for this phone.
        anketa:
          type: object
          additionalProperties: true
          description: ADR-0007. See RegisterEmailRequest.anketa.
      additionalProperties: false
    LoginEmailRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      additionalProperties: false
    GoogleSignInRequest:
      type: object
      required:
      - authorizationCode
      - redirectUri
      properties:
        authorizationCode:
          type: string
          writeOnly: true
          description: Google authorization-code from the client flow.
        redirectUri:
          type: string
          format: uri
      additionalProperties: false
    SessionEstablished:
      type: object
      description: 'Returned by any successful auth flow. For browsers the session is also set as the
        `ah_session`

        cookie; `sessionToken` is returned for native/mobile clients using the Bearer scheme.

        '
      required:
      - account
      - session
      properties:
        account:
          $ref: '#/components/schemas/Account'
        session:
          $ref: '#/components/schemas/Session'
        sessionToken:
          type:
          - string
          - 'null'
          description: Opaque session reference for Bearer clients. Null/omitted when only the cookie
            is issued.
      additionalProperties: false
    PasswordChangeRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
      additionalProperties: false
    RecoveryStartRequest:
      type: object
      description: Start account recovery via a verified phone or email.
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        email:
          type: string
          format: email
      additionalProperties: false
    BusinessProfile:
      type: object
      description: A company presence of one of the eight closed profile types (BC-02).
      required:
      - id
      - ownerUserId
      - profileType
      - name
      - status
      - slug
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        ownerUserId:
          type: string
          format: uuid
          readOnly: true
        profileType:
          type: string
          description: Closed platform vocabulary (eight types).
          enum:
          - CONSTRUCTION_COMPANY
          - MANUFACTURER
          - BUILDER
          - SUPPLIER
          - CONTRACTOR
          - ARCHITECT
          - INTERIOR_DESIGNER
          - SERVICE_PROVIDER
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        contacts:
          type: object
          additionalProperties: true
          description: Phones/emails/site (CompanyDetails).
        address:
          type:
          - string
          - 'null'
        slug:
          type: string
          readOnly: true
          description: Display-only routing; not an identity.
        status:
          type: string
          enum:
          - CREATED
          - ACTIVE
          - ARCHIVED
          readOnly: true
        badge:
          type:
          - object
          - 'null'
          readOnly: true
          description: Trust badge sub-state (null = never verified).
          properties:
            status:
              type: string
              enum:
              - VALID
              - EXPIRED
              - REVOKED
            issuedAt:
              type: string
              format: date-time
            validUntil:
              type: string
              format: date-time
          additionalProperties: false
        createdAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    BusinessProfileCreateRequest:
      type: object
      required:
      - profileType
      - name
      properties:
        profileType:
          type: string
          enum:
          - CONSTRUCTION_COMPANY
          - MANUFACTURER
          - BUILDER
          - SUPPLIER
          - CONTRACTOR
          - ARCHITECT
          - INTERIOR_DESIGNER
          - SERVICE_PROVIDER
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        contacts:
          type: object
          additionalProperties: true
        address:
          type: string
      additionalProperties: false
    BusinessProfileUpdateRequest:
      type: object
      description: Partial update; profileType is immutable and cannot be changed.
      properties:
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        contacts:
          type: object
          additionalProperties: true
        address:
          type: string
      additionalProperties: false
    PortfolioItem:
      type: object
      required:
      - id
      - mediaAssetId
      - position
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mediaAssetId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          maximum: 50
        caption:
          $ref: '#/components/schemas/LocalizedText'
      additionalProperties: false
    TeamMember:
      type: object
      description: 'A user granted a role on a business profile (realised as an identity RoleAssignment
        scoped to the

        profile; the profile owner manages membership). No new aggregate is introduced.

        '
      required:
      - userId
      - roleCode
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type:
          - string
          - 'null'
          readOnly: true
        roleCode:
          type: string
          description: A configured role code.
        invitedAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    VerificationCase:
      type: object
      description: A paid, manual verification work item (BC-02).
      required:
      - id
      - businessProfileId
      - status
      - slaDueAt
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        businessProfileId:
          type: string
          format: uuid
          readOnly: true
        entitlementId:
          type: string
          format: uuid
          description: VerificationEligibility precondition (I-12).
        status:
          type: string
          enum:
          - REQUESTED
          - IN_REVIEW
          - APPROVED
          - REJECTED
          readOnly: true
        slaDueAt:
          type: string
          format: date-time
          readOnly: true
        documents:
          type: array
          items:
            $ref: '#/components/schemas/SubmittedDocument'
        decision:
          type:
          - object
          - 'null'
          readOnly: true
          properties:
            outcome:
              type: string
              enum:
              - APPROVED
              - REJECTED
            reason:
              type: string
            decidedAt:
              type: string
              format: date-time
          additionalProperties: false
        createdAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    SubmittedDocument:
      type: object
      required:
      - mediaAssetId
      - documentKind
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mediaAssetId:
          type: string
          format: uuid
          description: Image asset (images only, FR-PROF-003).
        documentKind:
          type: string
        position:
          type: integer
          minimum: 1
      additionalProperties: false
    VerificationRequestCreate:
      type: object
      required:
      - entitlementId
      - documents
      properties:
        entitlementId:
          type: string
          format: uuid
        documents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SubmittedDocument'
      additionalProperties: false
    Listing:
      type: object
      description: An advertisement / product / service (BC-03 Listing). Promotion is a projection from
        entitlements.
      required:
      - id
      - listingType
      - ownerUserId
      - categoryId
      - formDefinitionVersionId
      - title
      - lifecycleState
      - slug
      - createdAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        listingType:
          type: string
          enum:
          - ADVERTISEMENT
          - PRODUCT
          - SERVICE
        ownerUserId:
          type: string
          format: uuid
          readOnly: true
        ownerProfileId:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        categoryId:
          type: string
          format: uuid
        categoryPath:
          type: string
          readOnly: true
        formDefinitionVersionId:
          type: string
          format: uuid
          readOnly: true
          description: Bound form version (I-07); immutable per edit-cycle.
        title:
          type: string
          maxLength: 200
        description:
          type:
          - string
          - 'null'
          maxLength: 8000
        attributes:
          $ref: '#/components/schemas/AttributeMap'
        price:
          $ref: '#/components/schemas/Money'
        location:
          $ref: '#/components/schemas/GeoPoint'
        lifecycleState:
          type: string
          enum:
          - DRAFT
          - PENDING_VERIFICATION
          - PUBLISHED
          - EDITED
          - SUSPENDED
          - ARCHIVED
          - DELETED
          readOnly: true
        isFlagged:
          type: boolean
          readOnly: true
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        promotion:
          type:
          - object
          - 'null'
          readOnly: true
          description: Projected from entitlement events (X-03); labelled and capped in search.
          properties:
            kind:
              type: string
              enum:
              - PREMIUM
              - FEATURED
              - TOP_PLACEMENT
            validUntil:
              type: string
              format: date-time
          additionalProperties: false
        images:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ListingImage'
        slug:
          type: string
          readOnly: true
        lockVersion:
          type: integer
          description: Optimistic-lock token; echo it on update (If-Match style).
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    ListingImage:
      type: object
      required:
      - mediaAssetId
      - position
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        mediaAssetId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
          maximum: 10
          description: Position 1 is the primary image.
        status:
          type: string
          enum:
          - PENDING
          - CLEAN
          - QUARANTINED
          readOnly: true
      additionalProperties: false
    ListingCreateRequest:
      type: object
      required:
      - listingType
      - categoryId
      - title
      - attributes
      properties:
        listingType:
          type: string
          enum:
          - ADVERTISEMENT
          - PRODUCT
          - SERVICE
        categoryId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 8000
        attributes:
          $ref: '#/components/schemas/AttributeMap'
        price:
          $ref: '#/components/schemas/Money'
        location:
          $ref: '#/components/schemas/GeoPoint'
        imageMediaAssetIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        publish:
          type: boolean
          default: false
          description: True to publish immediately (post-publication moderation, BRULE-17); false saves
            a draft.
      additionalProperties: false
    ListingUpdateRequest:
      type: object
      description: Owner edit; transitions the listing to EDITED and re-binds/re-validates against the
        current form version.
      required:
      - lockVersion
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 8000
        attributes:
          $ref: '#/components/schemas/AttributeMap'
        price:
          $ref: '#/components/schemas/Money'
        location:
          $ref: '#/components/schemas/GeoPoint'
        lockVersion:
          type: integer
          description: Must match the current lockVersion or 409.
      additionalProperties: false
    ListingStatusChangeRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - PUBLISH
          - ARCHIVE
          - SUSPEND
          - RENEW
          - RESTORE
          - DELETE
          description: Owner-permitted lifecycle transitions (I-05); illegal transitions return 409.
        reason:
          type: string
      additionalProperties: false
    ImageReorderRequest:
      type: object
      required:
      - order
      properties:
        order:
          type: array
          description: The full ordered list of image ids (position derives from array index; index 0
            = primary).
          items:
            type: string
            format: uuid
          maxItems: 10
      additionalProperties: false
    Favorite:
      type: object
      required:
      - listingId
      - createdAt
      properties:
        listingId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
          readOnly: true
      additionalProperties: false
    Category:
      type: object
      description: A navigable taxonomy node (read projection of the configured Category).
      required:
      - id
      - name
      - path
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        name:
          $ref: '#/components/schemas/LocalizedText'
        path:
          type: string
          description: Materialised path for subtree navigation.
        slug:
          type: string
        displayOrder:
          type: integer
        formDefinitionId:
          type: string
          format: uuid
          description: The one bound form (I-02).
        status:
          type: string
          enum:
          - ACTIVE
          - RETIRED
        iconUrl:
          type:
          - string
          - 'null'
          format: uri
          description: Public media URL for the category's icon, when the admin has uploaded one.
      additionalProperties: false
    FormDefinition:
      type: object
      description: The resolved dynamic form for a category (sections → fields → validators), delivered
        as data.
      required:
      - id
      - versionId
      - sections
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
          description: Immutable version bound by listings (I-07).
        categoryId:
          type: string
          format: uuid
        sections:
          type: array
          items:
            $ref: '#/components/schemas/FormSection'
      additionalProperties: false
    FormSection:
      type: object
      required:
      - code
      - label
      - fields
      properties:
        code:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedText'
        order:
          type: integer
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormField'
      additionalProperties: false
    FormField:
      type: object
      description: A field composed from a whitelisted field type with validation metadata and conditional
        visibility.
      required:
      - code
      - label
      - fieldType
      - required
      properties:
        code:
          type: string
          description: Key used in the listing AttributeMap.
        label:
          $ref: '#/components/schemas/LocalizedText'
        fieldType:
          type: string
          description: Whitelisted field type (closed [P] set).
          enum:
          - text
          - number
          - select
          - multiselect
          - boolean
          - date
          - range
          - location
          - file
        required:
          type: boolean
        facetEligible:
          type: boolean
          description: May be selected as a search facet.
        order:
          type: integer
        defaultValue: {}
        options:
          type: array
          description: For select/multiselect.
          items:
            type: object
            properties:
              value:
                type: string
              label:
                $ref: '#/components/schemas/LocalizedText'
            additionalProperties: false
        validators:
          type: array
          items:
            $ref: '#/components/schemas/ValidatorBinding'
        renderingHint:
          type:
          - string
          - 'null'
        conditionalVisibility:
          type:
          - object
          - 'null'
          description: Bounded declarative show/hide based on another field's value.
          properties:
            fieldCode:
              type: string
            operator:
              type: string
              enum:
              - EQUALS
              - NOT_EQUALS
              - IN
              - NOT_IN
              - GREATER_THAN
              - LESS_THAN
            value: {}
          additionalProperties: false
      additionalProperties: false
    ValidatorBinding:
      type: object
      required:
      - validatorType
      properties:
        validatorType:
          type: string
          description: Whitelisted validator (closed [P] set); pattern draws only from a safe set.
          enum:
          - required
          - length
          - numeric_range
          - pattern_safe
          - option_membership
          - image_count
        params:
          type: object
          additionalProperties: true
          description: Bounded parameters for the validator.
      additionalProperties: false
    SearchRequest:
      type: object
      description: Structured search query (also expressible via query parameters on GET /search).
      properties:
        q:
          type: string
          description: Free text; matched cross-script (Latin↔Cyrillic).
        categoryId:
          type: string
          format: uuid
        listingType:
          type: string
          enum:
          - ADVERTISEMENT
          - PRODUCT
          - SERVICE
        filters:
          type: object
          description: Facet filters keyed by facet-eligible field code (from the SearchConfiguration
            snapshot).
          additionalProperties: true
        priceMin:
          type: string
        priceMax:
          type: string
        verifiedOnly:
          type: boolean
        geo:
          type:
          - object
          - 'null'
          properties:
            center:
              $ref: '#/components/schemas/GeoPoint'
            radiusKm:
              type: number
              minimum: 0.1
              maximum: 200
          additionalProperties: false
        sort:
          type: string
          enum:
          - RELEVANCE
          - RECENCY
          - PRICE_ASC
          - PRICE_DESC
          default: RELEVANCE
      additionalProperties: false
    SearchResult:
      type: object
      description: Search response — matched listings, facet results, and promotion labelling.
      required:
      - items
      - facets
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
        facets:
          type: array
          items:
            $ref: '#/components/schemas/Facet'
        page:
          $ref: '#/components/schemas/CursorPage'
        degraded:
          type: boolean
          default: false
          description: True when served from the DB fallback (reduced result set).
      additionalProperties: false
    SearchHit:
      type: object
      required:
      - listingId
      - title
      properties:
        listingId:
          type: string
          format: uuid
        title:
          type: string
        categoryPath:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        location:
          $ref: '#/components/schemas/GeoPoint'
        thumbnailUrl:
          type:
          - string
          - 'null'
          format: uri
        verifiedBadge:
          type: boolean
        promoted:
          type:
