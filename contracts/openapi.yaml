            schema:
              $ref: '#/components/schemas/ListingImage'
      responses:
        '201':
          description: Attached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingImage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    put:
      tags:
      - Listings
      operationId: reorderListingImages
      summary: Reorder listing images
      description: Reorders images (index 0 becomes the primary). Batch operation over one aggregate.
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      - $ref: '#/components/parameters/ActingProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageReorderRequest'
      responses:
        '200':
          description: Reordered images.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingImage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /listings/{listingId}/images/{imageId}:
    delete:
      tags:
      - Listings
      operationId: detachListingImage
      summary: Remove a listing image
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /listings/{listingId}/statistics:
    get:
      tags:
      - Listings
      operationId: getListingStatistics
      summary: Get listing statistics (owner)
      description: Per-listing engagement counters from the closed metric vocabulary (FR-ANALYTICS-002).
        Owner only.
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingStatistics'
        '403':
          $ref: '#/components/responses/Forbidden'
  /me/listings:
    get:
      tags:
      - Listings
      operationId: listMyListings
      summary: List my listings
      description: Lists listings owned by the acting context in any lifecycle state (including drafts).
      parameters:
      - $ref: '#/components/parameters/ActingProfile'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: state
        in: query
        schema:
          type: string
          enum:
          - DRAFT
          - PENDING_VERIFICATION
          - PUBLISHED
          - EDITED
          - SUSPENDED
          - ARCHIVED
          - DELETED
      responses:
        '200':
          description: A page of the caller's listings.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/favorites:
    get:
      tags:
      - Favorites
      operationId: listFavorites
      summary: List favorites
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of favorites.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Favorites
      operationId: addFavorite
      summary: Add a favorite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - listingId
              properties:
                listingId:
                  type: string
                  format: uuid
              additionalProperties: false
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Favorite'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /me/favorites/{listingId}:
    delete:
      tags:
      - Favorites
      operationId: removeFavorite
      summary: Remove a favorite
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /categories:
    get:
      tags:
      - Categories
      operationId: listCategories
      summary: List categories (taxonomy)
      description: 'Returns the configured taxonomy as a flat list with parent references and materialised
        paths

        (assemble the tree client-side). Read projection of the published Category configuration; served

        from a cached snapshot and refreshed on ConfigurationChanged.

        '
      security: []
      parameters:
      - name: parentId
        in: query
        description: Restrict to direct children of a node; omit for roots.
        schema:
          type: string
          format: uuid
      - name: includeRetired
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '503':
          $ref: '#/components/responses/ServiceDegraded'
  /categories/{categoryId}:
    get:
      tags:
      - Categories
      operationId: getCategory
      summary: Get a category
      security: []
      parameters:
      - $ref: '#/components/parameters/CategoryIdPath'
      responses:
        '200':
          description: The category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /categories/{categoryId}/form:
    get:
      tags:
      - Categories
      operationId: getCategoryForm
      summary: Get the dynamic form for a category
      description: 'Returns the resolved FormDefinition (sections → fields → validators, with conditional
        visibility)

        bound to the category (I-02), delivered as data. This is the contract the frontend renders and

        the `attributes` map on a listing must satisfy. The returned `versionId` is the version a new

        listing binds to (I-07).

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/CategoryIdPath'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The form definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormDefinition'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceDegraded'
  /search:
    get:
      tags:
      - Search
      operationId: searchListingsGet
      summary: Search listings (query parameters)
      description: 'Full-text, faceted, geo/radius discovery over visible listings. Free text is matched
        cross-script

        (Latin↔Cyrillic, FR-SRCH-004). Facets are the facet-eligible fields selected in the

        SearchConfiguration snapshot. Promoted results are labelled and capped per page (BRULE-10, I-17).

        **Degradation:** if the index is unavailable, results are served from the DB fallback with

        `degraded:true` (QR-05). **Rate limiting:** public anti-scraping limits apply (NFR-SEC-005).

        **Performance:** target < 500 ms p95 (NFR-PERF-001).

        '
      security: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
      - name: listingType
        in: query
        schema:
          type: string
          enum:
          - ADVERTISEMENT
          - PRODUCT
          - SERVICE
      - name: filters
        in: query
        description: Facet filters as repeated `filters[fieldCode]=value` pairs (facet-eligible fields
          only).
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: true
      - name: priceMin
        in: query
        schema:
          type: string
      - name: priceMax
        in: query
        schema:
          type: string
      - name: verifiedOnly
        in: query
        schema:
          type: boolean
      - name: lat
        in: query
        schema:
          type: number
          format: double
      - name: lng
        in: query
        schema:
          type: number
          format: double
      - name: radiusKm
        in: query
        schema:
          type: number
          minimum: 0.1
          maximum: 200
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - RELEVANCE
          - RECENCY
          - PRICE_ASC
          - PRICE_DESC
          default: RELEVANCE
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results with facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
              examples:
                results:
                  $ref: '#/components/examples/SearchResultExample'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceDegraded'
    post:
      tags:
      - Search
      operationId: searchListingsPost
      summary: Search listings (structured body)
      description: Structured equivalent of GET /search for complex filter payloads. Same semantics and
        degradation behaviour.
      security: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results with facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceDegraded'
  /search/facets:
    get:
      tags:
      - Search
      operationId: getFacets
      summary: Get available facets for a scope
      description: Returns the facet dimensions (with localized labels) available for a category scope,
        from the SearchConfiguration snapshot.
      security: []
      parameters:
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Facet metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
  /search/suggest:
    get:
      tags:
      - Search
      operationId: suggest
      summary: Autocomplete / suggestions
      description: Query completions and suggestions from the normalized index (cross-script). For type-ahead
        UIs.
      security: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
      responses:
        '200':
          description: Suggestions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Suggestion'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /media/uploads:
    post:
      tags:
      - Media
      operationId: initMediaUpload
      summary: Initiate an image or video upload (presigned)
      description: 'Validates the intended type/size/context and returns a **presigned MinIO URL**;
        the client

        then PUTs the bytes directly. **Images and video only** — `image/jpeg|png|webp`,
        `video/mp4|webm` (DEC-10, widened by ADR-0008); PDF and any other type are rejected 422
        `UNSUPPORTED_MEDIA_TYPE`. Images are capped at 1.2 MB, video at 30 MB (ADR-0008). After
        upload the asset is scanned for malware; images are additionally EXIF/GPS-stripped and
        get THUMBNAIL/OPTIMIZED variants before delivery (I-20) — video has no server-side
        transcoding pipeline, so a clean video asset becomes deliverable with no variants, and
        processing is non-blocking either way (QR-05).

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaUploadInitRequest'
      responses:
        '201':
          description: Presigned upload target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadInitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Unsupported media type or oversize (images and video only).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /media/{mediaId}:
    get:
      tags:
      - Media
      operationId: getMedia
      summary: Get media metadata & preview URLs
      description: Returns asset metadata, scan/processing status, and CDN delivery URLs (original + variants)
        when CLEAN.
      parameters:
      - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '200':
          description: Media asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Media
      operationId: deleteMedia
      summary: Delete a media asset
      description: Removes the asset and its association; bytes are cleaned up by the media lifecycle
        job. Ownership validated.
      parameters:
      - $ref: '#/components/parameters/MediaIdPath'
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations:
    get:
      tags:
      - Messaging
      operationId: listConversations
      summary: List my conversations
      description: Returns the caller's conversations (inbox), most-recent first.
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
