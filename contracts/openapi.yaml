openapi: 3.1.0
info:
  title: Active Home Platform API
  version: 1.0.0
  summary: Configuration-driven housing & construction advertising marketplace (Uzbekistan) — v1 contract.
  description: "Enterprise OpenAPI 3.1 contract for **Active Home v1**, the implementation contract between\
    \ the\nweb frontend, backend (FastAPI modular monolith), AI coding agents, QA automation, future mobile\n\
    apps, and external integrations.\n\nThis document is generated from and fully aligned with the immutable\
    \ approved architecture:\nSRS v1.0, DDD Domain Model v1.0, Configuration & Metadata Framework v1.0,\
    \ SAD v1.0,\nDatabase Architecture & Logical Data Model v1.0, Physical Database Design v1.0, and the\n\
    API Architecture & Integration Specification v1.0.\n\n## Cross-cutting contract rules (see the API\
    \ Architecture Specification)\n- **Versioning:** URI major versioning under `/api/v1`. Within a major\
    \ version only additive,\n  backward-compatible change is allowed. Configuration changes (new categories,\
    \ forms, fields,\n  plans, roles, templates) are **never** contract changes — dynamic data flows through\
    \ stable\n  envelopes (`AttributeMap`, `LocalizedText`, `FormDefinition`), so the endpoint surface\
    \ is\n  invariant under the platform's normal mode of change.\n- **Authentication:** server-side sessions\
    \ backed by Redis (SAD §13). A session is established by an\n  auth flow and carried by a secure,\
    \ HttpOnly cookie (`ah_session`) for browsers, or the same\n  session token as a Bearer credential\
    \ for native/mobile clients. There is **no JWT and no\n  OAuth2 password/refresh-token grant** — that\
    \ would contradict the approved session model\n  (reconciliation, see Validation section of the API\
    \ Architecture Spec). Google is used only as a\n  federated **sign-in** provider (authorization-code),\
    \ after which a first-party session is issued.\n- **Authorization:** default-deny, evaluated against\
    \ a fixed `PermissionKey` catalogue `[P]`;\n  roles are configured compositions `[C]`. Every operation\
    \ is scoped to the acting context\n  (personal or a specific business profile); cross-profile access\
    \ is denied by default.\n- **Errors:** one Problem-style envelope (`Error`) with a stable machine\
    \ `code`, `traceId`, and\n  optional field-level `details` (`ValidationError`).\n- **Pagination:**\
    \ cursor-based (`CursorPage`) for large/ordered collections; opaque `cursor`.\n- **Idempotency:**\
    \ side-effecting POSTs accept an `Idempotency-Key` header.\n- **Localization:** user-visible text\
    \ uses the `LocalizedText` envelope (`uz_latn` canonical,\n  `uz_cyrl`, `ru`, `en`).\n- **Media:**\
    \ **images and video** (DEC-10, widened by ADR-0008). PDF and any other type are out of scope\n  for v1; the media endpoints\
    \ reject non-image/non-video content by contract.\n"
  contact:
    name: Active Home Architecture Team
  license:
    name: Proprietary
servers:
- url: https://api.activehome.uz/api/v1
  description: Production
- url: https://staging-api.activehome.uz/api/v1
  description: Staging
security:
- sessionCookie: []
tags:
- name: Authentication
  description: Phone-OTP, email, and Google federated sign-in flows; session issuance and recovery.
- name: Users
  description: The authenticated account, personal profile, preferences, and sessions.
- name: Business Profiles
  description: Company pages (eight profile types), portfolios, team members, and verification requests.
- name: Listings
  description: Advertisements / products / services — CRUD, drafts, lifecycle, promotion projection.
- name: Favorites
  description: A user's saved listings.
- name: Categories
  description: The configured taxonomy (read) and the dynamic form bound to a category.
- name: Search
  description: Full-text, faceted, geo/radius discovery, suggestions, and autocomplete.
- name: Media
  description: Image/video upload (presigned), association, ordering, metadata, and deletion — images and video only.
- name: Messaging
  description: Conversations, messages, phone reveal, blocks, and reporting.
- name: Notifications
  description: User notifications, read status, and preferences.
- name: Billing
  description: Products/plans, purchase orders, invoices, and entitlements — offline billing only.
- name: Ads
  description: Banner campaign scheduling/targeting (operator) and banner serving/engagement
    capture (public) — the descope-safe module (DEC-23). Added by ADR-0004.
- name: Configuration (Admin)
  description: Authoring of the eight configuration entities with the Head+Version lifecycle.
- name: Administration
  description: Moderation, verification queue, user management, audit log, dashboard, and reports.
paths:
  /auth/otp:
    post:
      tags:
      - Authentication
      operationId: requestOtp
      summary: Request a phone OTP
      description: 'Issues a single-use, expiring OTP via SMS (Eskiz) for registration, login, or recovery.

        **Rate limiting:** strict per-phone and per-IP throttle (`OtpThrottlePolicy`, NFR-SEC-004);

        repeated requests return 429 `OTP_THROTTLED`.

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: OTP dispatched (no content reveals whether the phone is registered).
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/otp/verify:
    post:
      tags:
      - Authentication
      operationId: verifyOtp
      summary: Verify a phone OTP and establish a session
      description: 'Verifies the OTP and, on success, creates/authenticates the account and issues a first-party

        session (cookie + optional Bearer token). For REGISTRATION a new account is created; an existing

        verified phone is authenticated (FR-AUTH-001/004).

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Session established.
          headers:
            Set-Cookie:
              description: Sets the `ah_session` cookie for browser clients.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEstablished'
              examples:
                established:
                  $ref: '#/components/examples/SessionEstablishedExample'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register/email:
    post:
      tags:
      - Authentication
      operationId: registerEmail
      summary: Register with email and password
      description: Creates an account pending email confirmation (FR-AUTH-002). Duplicate email is rejected
        409.
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEmailRequest'
      responses:
        '202':
          description: Account created; confirmation email sent.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/email:
    post:
      tags:
      - Authentication
      operationId: loginEmail
      summary: Log in with email and password
      description: Authenticates an email-credential account and establishes a session (FR-AUTH-004).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEmailRequest'
      responses:
        '200':
          description: Session established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEstablished'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login/google:
    post:
      tags:
      - Authentication
      operationId: loginGoogle
      summary: Federated sign-in with Google
      description: 'Exchanges a Google authorization code, then links (by verified email) or creates the
        account and

        issues a first-party session (FR-AUTH-003). Google is a sign-in provider only; no Google token
        is

        exposed to the client afterwards.

        '
      security:
      - googleOAuth:
        - openid
        - email
        - profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
      responses:
        '200':
          description: Session established (account linked or created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEstablished'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Log out (terminate the current session)
      description: Revokes the current session immediately (FR-AUTH-005). The cookie is cleared.
      responses:
        '204':
          description: Session terminated.
          headers:
            Set-Cookie:
              description: Clears the `ah_session` cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/recovery:
    post:
      tags:
      - Authentication
      operationId: startRecovery
      summary: Start credential recovery
      description: Initiates recovery via a verified phone or email (FR-AUTH-006). Response does not reveal
        account existence.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryStartRequest'
      responses:
        '202':
          description: Recovery instructions dispatched if the identifier matches an account.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me:
    get:
      tags:
      - Users
      operationId: getMe
      summary: Get the authenticated account
      description: Returns the current account, privacy settings, preferences, owned profiles, and roles.
      parameters:
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Users
      operationId: updateMe
      summary: Update personal profile
      description: Updates display name and personal profile fields (FR-USER-001).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
              additionalProperties: false
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /me/password:
    put:
      tags:
      - Users
      operationId: changePassword
      summary: Change password
      description: Changes the password for an email-credential account. Other sessions may be revoked
        server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /me/preferences:
    put:
      tags:
      - Users
      operationId: updatePreferences
      summary: Update notification & privacy preferences
      description: Updates notification channel opt-ins and phone-reveal privacy (FR-USER-003; OTP always
        via SMS regardless).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                privacySettings:
                  $ref: '#/components/schemas/PrivacySettings'
                notificationPreferences:
                  $ref: '#/components/schemas/NotificationPreferences'
              additionalProperties: false
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/account:
    delete:
      tags:
      - Users
      operationId: closeAccount
      summary: Close (anonymise) the account
      description: 'Closes the account. Modelled as **anonymisation, not deletion** (FR-USER-005, DM-06):
        personal

        identifiers are irreversibly replaced; the account id survives so listings, orders, and audit

        references remain valid.

        '
      responses:
        '204':
          description: Account closed and anonymised.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/sessions:
    get:
      tags:
      - Users
      operationId: listSessions
      summary: List active sessions
      description: Returns the account's active sessions (login history / device list).
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/sessions/{sessionId}:
    delete:
      tags:
      - Users
      operationId: revokeSession
      summary: Revoke a session
      description: Revokes a specific session (remote logout).
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/sessions/switch-profile:
    post:
      tags:
      - Users
      operationId: switchActingProfile
      summary: Switch the acting profile for the current session
      description: 'Sets the acting context (personal or a specific owned business profile) on the current
        session

        (FR-USER-002). A session-level operation, not a re-authentication.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actingProfileId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: null = personal context.
              additionalProperties: false
      responses:
        '200':
          description: Updated session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /business-profiles:
    get:
      tags:
      - Business Profiles
      operationId: listBusinessProfiles
      summary: List business profiles
      description: Public directory of active business profiles; supports cursor pagination and filtering
        by type.
      security: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: profileType
        in: query
        schema:
          type: string
          enum:
          - CONSTRUCTION_COMPANY
          - MANUFACTURER
          - BUILDER
          - SUPPLIER
          - CONTRACTOR
          - ARCHITECT
          - INTERIOR_DESIGNER
          - SERVICE_PROVIDER
      - name: verifiedOnly
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: A page of business profiles.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/BusinessProfile'
    post:
      tags:
      - Business Profiles
      operationId: createBusinessProfile
      summary: Create a company profile
      description: Creates a business profile owned by the authenticated account (FR-PROF-001). One account
        may own many.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfileCreateRequest'
      responses:
        '201':
          description: Created profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /business-profiles/{profileId}:
    get:
      tags:
      - Business Profiles
      operationId: getBusinessProfile
      summary: Get a business profile
      security: []
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Business Profiles
      operationId: updateBusinessProfile
      summary: Manage a business profile
      description: Updates a profile the caller owns (FR-PROF-002). `profileType` is immutable. Ownership
        is validated.
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessProfileUpdateRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Business Profiles
      operationId: archiveBusinessProfile
      summary: Archive a business profile
      description: Archives the profile (state, not deletion — DM-06). Referenced listings/orders remain
        valid.
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '204':
          description: Archived.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /business-profiles/{profileId}/portfolio:
    get:
      tags:
      - Business Profiles
      operationId: listPortfolio
      summary: List portfolio items
      security: []
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '200':
          description: Ordered portfolio.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortfolioItem'
    post:
      tags:
      - Business Profiles
      operationId: addPortfolioItem
      summary: Add a portfolio item
      description: Attaches an image (MediaAssetRef) to the profile portfolio.
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioItem'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /business-profiles/{profileId}/portfolio/{itemId}:
    delete:
      tags:
      - Business Profiles
      operationId: removePortfolioItem
      summary: Remove a portfolio item
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /business-profiles/{profileId}/team:
    get:
      tags:
      - Business Profiles
      operationId: listTeamMembers
      summary: List team members
      description: 'Lists users granted a role on this profile. Realised as identity role-assignments
        scoped to the

        profile — no new aggregate (see Validation note). Requires manage-team permission.

        '
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '200':
          description: Team members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Business Profiles
      operationId: addTeamMember
      summary: Add a team member
      description: Grants a configured role to a user on this profile (ownership + permission validated).
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMember'
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /business-profiles/{profileId}/team/{userId}:
    delete:
      tags:
      - Business Profiles
      operationId: removeTeamMember
      summary: Remove a team member
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed.
        '403':
          $ref: '#/components/responses/Forbidden'
  /business-profiles/{profileId}/verification:
    get:
      tags:
      - Business Profiles
      operationId: getVerificationCase
      summary: Get the current verification case
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      responses:
        '200':
          description: Verification case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCase'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Business Profiles
      operationId: requestVerification
      summary: Request business verification
      description: 'Submits a verification request with documents. Requires an active VerificationEligibility

        entitlement (I-12, eventually consistent — a brief window may exist after payment confirmation).

        '
      parameters:
      - $ref: '#/components/parameters/ProfileIdPath'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationRequestCreate'
      responses:
        '201':
          description: Verification case created and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationCase'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /listings:
    get:
      tags:
      - Listings
      operationId: listListings
      summary: Browse listings
      description: 'Public browse of visible listings (Published/Edited, unflagged, unexpired — I-06).
        For rich

        discovery use `/search`. Supports cursor pagination and basic category/type filters.

        '
      security: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Fields'
      - name: categoryId
        in: query
        schema:
          type: string
          format: uuid
      - name: listingType
        in: query
        schema:
          type: string
          enum:
          - ADVERTISEMENT
          - PRODUCT
          - SERVICE
      responses:
        '200':
          description: A page of listings.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Listing'
    post:
      tags:
      - Listings
      operationId: createListing
      summary: Create a listing (draft or published)
      description: 'Creates a listing owned by the acting context. `attributes` are validated against
        the form

        version bound to the category (I-07); quota is enforced (I-08). With `publish:true` the listing

        is published immediately unless flagged by automated validation (post-publication moderation,

        BRULE-17); otherwise it is saved as a draft (FR-ADV-001/003/004).

        '
      parameters:
      - $ref: '#/components/parameters/ActingProfile'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingCreateRequest'
            examples:
              create:
                $ref: '#/components/examples/ListingCreateExample'
      responses:
        '201':
          description: Listing created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
              examples:
                listing:
                  $ref: '#/components/examples/ListingExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /listings/{listingId}:
    get:
      tags:
      - Listings
      operationId: getListing
      summary: Get listing detail
      description: Returns full listing detail and records a view metric (FR-ADV-010, DEC-06). Non-owners
        see only visible listings.
      security: []
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
              examples:
                listing:
                  $ref: '#/components/examples/ListingExample'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Listings
      operationId: updateListing
      summary: Edit a listing
      description: 'Owner edit; transitions to EDITED and re-validates attributes against the current
        form version

        (FR-ADV-005). Optimistic locking: `lockVersion` must match or 409. Ownership validated.

        '
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      - $ref: '#/components/parameters/ActingProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingUpdateRequest'
      responses:
        '200':
          description: Updated listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Listings
      operationId: deleteListing
      summary: Delete a listing
      description: Transitions to DELETED (terminal state, record retained — DM-06). Ownership validated.
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      - $ref: '#/components/parameters/ActingProfile'
      responses:
        '204':
          description: Listing deleted (state).
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /listings/{listingId}/status:
    post:
      tags:
      - Listings
      operationId: changeListingStatus
      summary: Change listing lifecycle state
      description: 'Applies an owner-permitted lifecycle transition — publish, archive, suspend, renew,
        restore,

        delete (FR-ADV-006/007). Only transitions legal in the fixed graph are accepted; others 409

        `ILLEGAL_STATE_TRANSITION`. Every transition is recorded (I-05).

        '
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      - $ref: '#/components/parameters/ActingProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingStatusChangeRequest'
      responses:
        '200':
          description: Updated listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /listings/{listingId}/images:
    get:
      tags:
      - Listings
      operationId: listListingImages
      summary: List listing images
      security: []
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      responses:
        '200':
          description: Ordered images.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingImage'
    post:
      tags:
      - Listings
      operationId: attachListingImage
      summary: Attach an image to a listing
      description: Attaches a CLEAN image MediaAssetRef. Max 10 (BRULE-06/I-04); the 11th is rejected
        422.
      parameters:
      - $ref: '#/components/parameters/ListingIdPath'
      - $ref: '#/components/parameters/ActingProfile'
      requestBody:
        required: true
        content:
